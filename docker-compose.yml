services:
  backend:
    build:
      context: ./backend
    environment:
      TASK_DATABASE_PATH: /data/tasks.sqlite3
    volumes:
      - task_history:/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  task_history:

